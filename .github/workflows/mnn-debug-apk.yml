name: Build MNN debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mnn-group-summary

permissions:
  contents: read

concurrency:
  group: mnn-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android ARM64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MNN_BUILD_DIR: ${{ github.workspace }}/.local-build
      ANDROID_SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/.local-build/signing/current.keystore
      GRADLE_USER_HOME: ${{ github.workspace }}/.local-build/gradle-user
      ANDROID_USER_HOME: ${{ github.workspace }}/.local-build/android-user
      MNN_BUILD_ABI: arm64-v8a
      MNN_BUILD_WORKERS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'

    steps:
      - name: Make room for native sources and build outputs
        shell: bash
        run: |
          # These preinstalled toolchains are unrelated to this Android build.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE"
          free -h

      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Validate Telegram API secrets
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python3 tools/check-telegram-api.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test signing and API configuration with synthetic credentials
        shell: bash
        run: python3 -B -m unittest discover -s tests/build-config -p 'test_*.py'

      - name: Restore and verify the original signing key from Secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tools/prepare-android-signing.py --output "$ANDROID_SIGNING_KEYSTORE_PATH"

      - name: Run AI summary regression tests and fixture validation
        timeout-minutes: 10
        shell: bash
        env:
          AI_SUMMARY_TOOLS_DIR: ${{ env.MNN_BUILD_DIR }}/ai-summary-tools
        run: |
          bash tests/ai-summary/bootstrap-tools.sh
          bash tests/ai-summary/run.sh
          bash tests/ai-summary-controller/run.sh
          bash tests/ai-summary-foreground/run.sh
          bash tests/notes-store/run.sh
          python3 tests/ai-summary/fixtures/validate_fixtures.py

      - name: Install the Android toolchain
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          mkdir -p "$ANDROID_USER_HOME"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"

          # Ignore yes's SIGPIPE, while preserving an actual sdkmanager failure.
          set +e
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses > /dev/null
          license_status=${PIPESTATUS[1]}
          set -e
          if [[ "$license_status" -ne 0 ]]; then
            exit "$license_status"
          fi
          "$sdkmanager" --sdk_root="$sdk_root" \
            'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;27.2.12479018' 'cmake;3.22.1'
          "$sdkmanager" --sdk_root="$sdk_root" --list_installed

      - name: Verify fingerprint session, timeout and settings boundaries
        shell: bash
        run: |
          ECJ_JAR="$MNN_BUILD_DIR/ai-summary-tools/ecj.jar" \
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar" \
            bash tests/notes-gate/run.sh
          ECJ_JAR="$MNN_BUILD_DIR/ai-summary-tools/ecj.jar" bash tests/notes-gate/preferences/run.sh

      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches/modules-2
            ${{ env.GRADLE_USER_HOME }}/wrapper/dists
          key: mnn-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            mnn-gradle-${{ runner.os }}-

      - name: Build the ARM64 AfatDebug APK
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash tools/build-mnn-debug.sh \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            -Dorg.gradle.parallel=false \
            --stacktrace

      - name: Verify native Telegram publish entities
        run: bash tests/ai-summary/run-publish-entities.sh

      - name: Verify group filtering and local deleted-message records
        env:
          AI_SUMMARY_TOOLS_DIR: ${{ env.MNN_BUILD_DIR }}/ai-summary-tools
        run: |
          bash tests/group-messages/run-filter.sh
          bash tests/group-messages/run-settings.sh
          bash tests/group-messages-store/run.sh
          bash tests/group-messages/run-revoked.sh
          bash tests/group-messages/run-revoked-boundary.sh

      - name: Verify and prepare the APK
        shell: bash
        run: |
          apk='TMessagesProj_App/build/outputs/apk/afat/debug/app.apk'
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/telegram-apk-signature.txt"
          cat "$RUNNER_TEMP/telegram-apk-signature.txt"
          "$build_tools/zipalign" -c -P 16 -v 4 "$apk"
          python3 - "$apk" "$RUNNER_TEMP/telegram-apk-signature.txt" <<'PY'
          import pathlib
          import re
          import sys
          import zipfile

          expected = 'c8715ba0c50510b9c1cc4d52b0fd2b0aed82dd55675f89c4f48d68978b7df313'
          report = pathlib.Path(sys.argv[2]).read_text()
          signers = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)$', report, re.MULTILINE)
          if [digest.lower() for digest in signers] != [expected]:
              raise SystemExit('APK signing certificate does not match the original Telegram signer')
          print('Verified APK certificate matches the original Telegram signer')
          with zipfile.ZipFile(sys.argv[1]) as archive:
              abis = {name.split('/')[1] for name in archive.namelist()
                      if name.startswith('lib/') and name.endswith('.so')}
          if abis != {'arm64-v8a'}:
              raise SystemExit(f'Expected only arm64-v8a native libraries, found {sorted(abis)}')
          print('Verified APK native ABI: arm64-v8a')
          PY
          mkdir -p artifacts
          install -m 644 "$apk" artifacts/Telegram-MNN-arm64-debug.apk
          (
            cd artifacts
            sha256sum Telegram-MNN-arm64-debug.apk > Telegram-MNN-arm64-debug.apk.sha256
          )
          {
            echo '### MNN Android debug build'
            echo 'Download the APK and its .sha256 checksum from the artifact below.'
            echo 'Architecture: arm64-v8a. Package: org.telegram.messenger.beta.'
            echo 'Telegram API credentials were supplied by repository Actions Secrets; upstream defaults are not used.'
            echo 'The original signing key was restored from Actions Secrets and its certificate was verified before building.'
            echo 'Missing or incorrect signing Secrets stop the build; no replacement key is generated.'
            echo 'The signing key is not included in this APK artifact.'
            echo
            echo '```text'
            cat artifacts/Telegram-MNN-arm64-debug.apk.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the verified APK and checksum
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-MNN-arm64-debug-${{ github.run_number }}
          path: |
            artifacts/Telegram-MNN-arm64-debug.apk
            artifacts/Telegram-MNN-arm64-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Link the APK download in the build summary
        env:
          APK_ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        shell: bash
        run: |
          printf '\n[Download the verified APK and checksum](%s)\n' "$APK_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the temporary signing key
        if: always()
        shell: bash
        run: rm -f -- "$ANDROID_SIGNING_KEYSTORE_PATH"

      - name: Report remaining disk and memory
        if: always()
        shell: bash
        run: |
          df -h "$GITHUB_WORKSPACE"
          free -h
