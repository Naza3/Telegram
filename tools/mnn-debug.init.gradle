// One ABI and the explicitly supplied fork signing key. Use with debug tasks only.
gradle.beforeProject { target ->
    ['com.android.application', 'com.android.library'].each { pluginId ->
        target.pluginManager.withPlugin(pluginId) {
            if (target.path in [':TMessagesProj', ':TMessagesProj_App']) {
                target.extensions.getByName('androidComponents').finalizeDsl { android ->
                    def abi = gradle.startParameter.projectProperties.get('mnnAbi') ?: 'arm64-v8a'
                    android.defaultConfig.ndk.abiFilters.clear()
                    android.defaultConfig.ndk.abiFilters.add(abi)
                    android.productFlavors.each { flavor ->
                        flavor.ndk.abiFilters.clear()
                        flavor.ndk.abiFilters.add(abi)
                    }
                    if (target.path == ':TMessagesProj_App') {
                        def keyPath = System.getProperty('mnnDebugKeystore')
                        if (!keyPath) {
                            throw new GradleException('Pass -DmnnDebugKeystore=<local debug keystore>')
                        }
                        def signingValues = ['ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'].collectEntries { name ->
                            def value = System.getenv(name)
                            if (value == null || value.isEmpty()) {
                                throw new GradleException('Missing signing setting: ' + name)
                            }
                            [(name): value]
                        }
                        android.signingConfigs.getByName('debug').with {
                            storeFile = new File(keyPath)
                            storePassword = signingValues['ANDROID_KEYSTORE_PASSWORD']
                            keyAlias = signingValues['ANDROID_KEY_ALIAS']
                            keyPassword = signingValues['ANDROID_KEY_PASSWORD']
                        }
                    }
                }
            }
        }
    }
}
